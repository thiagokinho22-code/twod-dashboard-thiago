services:
  - type: web
    name: twod-hub-api
    env: python
    plan: free
    buildCommand: ""
    startCommand: python backend/server.py
    envVars:
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_REFRESH_TOKEN
        sync: false
      - key: ONEDRIVE_TENANT
        value: consumers
