<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TwoD AutoFill</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            box-sizing: border-box;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
            margin: 0 0 12px 0;
        }
        .status-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 8px;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h2>⚡ TwoD AutoFill</h2>
    <p>Extensão ativa para autopreencher a Dash <strong>FUN Digital</strong>, <strong>Meta Ads</strong> e ajustar posts no <strong>WordPress</strong>.</p>
    
    <div class="status-box">
        <div>Status: <span class="badge">Pronta</span></div>
        <div style="margin-top: 6px; font-size: 11px; color: #94a3b8; line-height: 1.5;">
            • <a href="https://app.fundigital.net.br/ferramentas/criativo" target="_blank" style="color:#38bdf8;">FUN Digital</a>: Fila dos 9 sites<br>
            • <a href="https://adsmanager.facebook.com" target="_blank" style="color:#38bdf8;">Meta Ads</a>: Automação de anúncios e duplicações<br>
            • <strong>WordPress</strong> (<code>/wp-admin/edit.php</code>): Tags e comentários em massa
        </div>
    </div>

    <div style="font-size: 11px; color: #64748b; text-align: center;">
        TwoD Working v1.1 • Alexandre
    </div>
</body>
</html>
