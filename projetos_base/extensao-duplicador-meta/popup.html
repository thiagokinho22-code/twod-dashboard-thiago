<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Meta Ads Block Automator</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 8px 0;
      color: #38bdf8;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 12px 0;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 12.5px;
    }
    button:hover {
      opacity: 0.92;
    }
    .status {
      margin-top: 10px;
      font-size: 11.5px;
      color: #34d399;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>⚡ AutoAds Blocos</h3>
  <p>
    O painel flutuante aparece automaticamente no canto superior direito da sua aba do <b>Meta Ads Manager</b>.
  </p>
  <button id="btn-open-panel">Abrir / Mostrar Painel na Aba Atual</button>
  <div class="status" id="status-msg"></div>
  <script src="popup.js"></script>
</body>
</html>
